services:
  log-db:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_logs}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - log-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  log-api:
    build: .
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_logs}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_HOST: log-db
      DB_PORT: 5432
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      log-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  log-data:
